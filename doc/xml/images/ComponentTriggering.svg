<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#395674"/></marker></defs>
  <rect width="900" height="420" fill="white"/>
  <g font-family="sans-serif" fill="#182c40" font-size="17">
    <title id="title">Explicit component scheduling</title>
    <desc id="desc">An activity or external scheduler executes component cycles. Publishing data never schedules a receiving component. Operation messages retain their independent scheduling behavior.</desc>
    <text x="35" y="45" font-size="25">Explicit component scheduling</text>
    <rect x="35" y="80" width="360" height="85" rx="10" fill="#e4eef8"/>
    <text x="55" y="113">Activity timeout or I/O readiness</text>
    <text x="55" y="142">External scheduler: execute()</text>
    <path d="M395,122 H475" stroke="#395674" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="490" y="80" width="370" height="85" rx="10" fill="#e3f2e8"/>
    <text x="510" y="113">Refresh inputs → updateHook()</text>
    <text x="510" y="142">Publish outputs after a successful hook</text>
    <rect x="35" y="205" width="360" height="70" rx="10" fill="#e4eef8"/>
    <text x="55" y="247">Queued operations / activity trigger</text>
    <path d="M395,240 H475" stroke="#395674" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="490" y="205" width="370" height="70" rx="10" fill="#e3f2e8"/>
    <text x="510" y="247">Process operation messages</text>
    <text x="35" y="325">Ports store state; publication never wakes a consumer.</text>
    <text x="35" y="355">TaskContext::trigger() retains the selected activity’s timeout behavior.</text>
    <text x="35" y="385">Nonperiodic components can run cycles through an external scheduler.</text>
  </g>
</svg>
