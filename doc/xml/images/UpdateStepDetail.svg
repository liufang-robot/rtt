<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#395674"/></marker></defs>
  <rect width="900" height="420" fill="white"/>
  <g font-family="sans-serif" fill="#182c40" font-size="17">
    <title id="title">A component cycle</title>
    <desc id="desc">Messages and functions run first. The engine refreshes all registered inputs, calls updateHook, and publishes outputs only while the component remains running. Nested service ports use the same boundary.</desc>
    <text x="35" y="45" font-size="25">A component cycle</text>
    <rect x="35" y="90" width="180" height="90" rx="10" fill="#e4eef8"/>
    <text x="55" y="124">Process messages</text><text x="55" y="153">and functions</text>
    <path d="M215,135 H245" stroke="#395674" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="255" y="90" width="175" height="90" rx="10" fill="#e3f2e8"/>
    <text x="275" y="124">Refresh all</text><text x="275" y="153">input images</text>
    <path d="M430,135 H460" stroke="#395674" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="470" y="90" width="170" height="90" rx="10" fill="#e3f2e8"/>
    <text x="490" y="140">updateHook()</text>
    <path d="M640,135 H670" stroke="#395674" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="680" y="90" width="180" height="90" rx="10" fill="#e3f2e8"/>
    <text x="700" y="124">Publish all</text><text x="700" y="153">output images</text>
    <text x="35" y="240">Root ports and nested service ports share the owner’s cycle.</text>
    <text x="35" y="280">Input images remain stable throughout updateHook().</text>
    <text x="35" y="320">A stopped, faulting or throwing hook does not publish partial outputs.</text>
    <text x="35" y="360">Operation-only trigger steps process messages without running a cycle.</text>
  </g>
</svg>
